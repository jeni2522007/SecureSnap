
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureSnap | Image Security Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="header">
        <div class="brand">
            <h1>SecureSnap</h1>
            <p>Smart Image Security Analyzer</p>
        </div>
        <span class="header-status">● System Ready</span>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Image Security Dashboard</h2>
            <p>Analyze, protect and secure your images with intelligent technology.</p>
        </section>

        <section class="upload-card">
            <div class="upload-icon">🛡️</div>
            <h2>Upload Your Image</h2>
            <p>Select a JPG, JPEG or PNG image to begin analysis.</p>

            <input type="file" id="imageInput" accept=".jpg,.jpeg,.png,image/jpeg,image/png">

            <button id="analyzeButton" onclick="analyzeImage()">
                Analyze Image
            </button>

            <p id="message" aria-live="polite"></p>
        </section>

        <section id="resultSection" class="results hidden">
            <h2>Analysis Report</h2>
            <div id="resultContent"></div>
        </section>

    </main>

    <footer>
        <p>SecureSnap | Image Security & Analysis Platform</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
