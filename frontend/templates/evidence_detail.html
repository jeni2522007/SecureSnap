{% extends "base.html" %}
{% block title %}Evidence Item{% endblock %}

{% block content %}

<div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap">
    <div>
        <h1 id="itemTitle">Evidence item</h1>
        <p id="itemSubtitle" style="font-family:var(--mono)"></p>
    </div>
    <div class="btn-row">
        <button class="btn btn-ghost" id="verifyBtn">Verify integrity</button>
        <a class="btn btn-accent" id="reportBtn" href="/report/{{ evidence_id }}">Court report</a>
    </div>
</div>

<div id="verifyHolder"></div>

<div class="grid grid-side" id="evidenceApp" data-evidence-id="{{ evidence_id }}">
    <div style="display:grid; gap:18px">

        <div class="card">
            <div class="card-head"><h2>Examination summary</h2></div>
            <div class="card-body" id="summaryHolder"></div>
        </div>

        <div class="card">
            <div class="card-head"><h2>Findings</h2></div>
            <div class="card-body tight" id="findingsHolder"></div>
        </div>

        <div class="card">
            <div class="card-head"><h2>Analysis history</h2></div>
            <div class="card-body tight" id="historyHolder"></div>
        </div>

    </div>

    <div style="display:grid; gap:18px">
        <div class="card">
            <div class="card-head"><h3>Register details</h3></div>
            <div class="card-body">
                <label class="field">
                    <span class="field-label">Case reference</span>
                    <input type="text" id="editCaseRef">
                </label>
                <label class="field">
                    <span class="field-label">Exhibit reference</span>
                    <input type="text" id="editExhibitRef">
                </label>
                <label class="field">
                    <span class="field-label">Description</span>
                    <input type="text" id="editTitle">
                </label>
                <label class="field">
                    <span class="field-label">Narrative</span>
                    <textarea id="editDescription" rows="3"></textarea>
                </label>
                <label class="field">
                    <span class="field-label">Source</span>
                    <input type="text" id="editSource">
                </label>
                <label class="field">
                    <span class="field-label">Collected by</span>
                    <input type="text" id="editCollectedBy">
                </label>
                <div class="btn-row">
                    <button class="btn btn-primary btn-sm" id="saveBtn">Save changes</button>
                    <button class="btn btn-danger btn-sm" id="deleteBtn">Remove from register</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-head"><h3>Fingerprints</h3></div>
            <div class="card-body tight" id="fingerprintHolder"></div>
        </div>

        <div class="card">
            <div class="card-head"><h3>Audit trail</h3></div>
            <div class="card-body tight" id="auditHolder"></div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='evidence_detail.js') }}"></script>
{% endblock %}
